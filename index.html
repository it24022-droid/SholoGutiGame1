<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sholo Guti Game</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
</head>
<body style="text-align: center; background-color: #222; color: white; margin-top: 50px;">
    <h2>১৬ গুটি খেলা (Sholo Guti)</h2>
    <div id="app" style="width: 1000px; height: 700px; margin: auto; border: 2px solid #555;"></div>
    <script>
        async function runGame() {
            await cheerpjInit({ version: 17 });
            cheerpjCreateDisplay(-1, -1, document.getElementById("app"));
            await cheerpjRunJar("/app/shologutii3-1.0-SNAPSHOT.jar");
        }
        window.addEventListener('load', runGame);
    </script>
</body>
</html>
